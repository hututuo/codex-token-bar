<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Token Bar</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell">
        <section class="boot-card" aria-label="Codex Token Bar 正在启动">
          <div class="boot-mark">CX</div>
          <div>
            <strong>Codex Token Bar</strong>
            <span>正在打开本地面板...</span>
          </div>
        </section>
      </main>
    </div>
    <style>
      :root {
        background: #eef3f8;
        color: #20252d;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable",
          "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .boot-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background:
          radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.42), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.34), transparent 260px),
          #eef3f8;
      }

      .boot-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border: 1px solid rgba(65, 76, 92, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
      }

      .boot-mark {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #ff9a31, #ff771f);
        color: white;
        font-size: 20px;
        font-weight: 760;
      }

      .boot-card strong,
      .boot-card span {
        display: block;
      }

      .boot-card strong {
        font-size: 15px;
        font-weight: 720;
      }

      .boot-card span {
        margin-top: 4px;
        color: #7c8695;
        font-size: 12px;
        font-weight: 620;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111721;
          color: #e8eef8;
        }

        .boot-shell {
          background:
            radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.06), transparent 34%),
            linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 260px),
            #111721;
        }

        .boot-card {
          border-color: rgba(218, 228, 244, 0.12);
          background: rgba(28, 36, 48, 0.86);
        }

        .boot-card span {
          color: #98a5b7;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
