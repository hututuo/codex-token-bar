<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧栏压合动画 · 候选实际组件</title><div id="root"></div><script type="module" src="./sidebar-squeeze-review.tsx"></script></html>
<style>body{margin:0;background:#161a1e;color:#e9edf1}.squeeze-review{max-width:900px;margin:25px auto;padding:0 24px;font-family:-apple-system,sans-serif}.squeeze-review h1{font-size:23px;font-weight:600;margin:0 0 10px}.squeeze-review header p{font-size:12px;color:#a7afb7}.review-layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:40px;margin-top:20px}.preview-rail.qs-rail{width:88px;height:550px;background:transparent;overflow:visible;border-radius:0}.preview-rail::before{content:"";position:absolute;left:0;top:85px;width:16px;height:380px;border-radius:0 10px 10px 0;background:#080a09;transition:width .44s cubic-bezier(.333333,1,.666667,1),height .44s cubic-bezier(.333333,1,.666667,1),top .44s cubic-bezier(.333333,1,.666667,1)}.preview-rail.expanded::before{width:88px;height:550px;top:0;border-radius:0 22px 22px 0}.preview-rail .qs-summary{gap:13px;overflow:visible}.preview-rail .qs-quota-trigger,.preview-rail .qs-model-trigger,.preview-rail .qs-running-trigger{border:0;background:none;box-shadow:none}.preview-rail .qs-quota-trigger strong{color:#e6eaf0}.review-controls{padding-top:50px}.review-tag{font-size:11px;color:#a3d977}.review-controls h2{font-size:21px;margin:12px 0 18px}.review-buttons{display:flex;gap:9px;margin:0 0 25px}.review-buttons button{padding:9px 15px;background:#2b333d;border:1px solid #424f5e;border-radius:8px;color:#edf2f7;cursor:pointer}.review-buttons button:active{transform:translateY(2px);background:#38485b}.review-controls label{display:flex;gap:7px;align-items:center;font-size:13px}.review-controls p{max-width:480px;font-size:14px;line-height:1.8;color:#bdc5ce}.review-controls .review-note{font-size:12px;color:#99a5b1}@media(prefers-reduced-motion:reduce){.preview-rail::before{transition:none}}</style>
