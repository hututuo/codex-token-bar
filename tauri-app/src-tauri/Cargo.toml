[package]
name = "codex-token-bar"
version = "0.1.0"
description = "Cross-platform Codex Token Bar prototype"
authors = ["Codex Token Bar"]
edition = "2021"

[lib]
name = "codex_token_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
time = { version = "0.3.49", features = ["formatting", "local-offset", "macros", "parsing"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
