[package]
name = "codex-token-bar"
version = "0.1.0"
description = "Cross-platform Codex Token Bar prototype"
authors = ["Codex Token Bar"]
edition = "2021"

[lib]
name = "codex_token_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
