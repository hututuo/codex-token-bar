name: Windows exact-index regression
on:
  push:
    branches: [fix/v092-audit-sidebar]
    paths:
      - '.github/workflows/index-regression.yml'
      - 'tauri-app/src-tauri/src/core/usage/token_count_jsonl/**'
      - 'tauri-app/src-tauri/src/core/coordination_fs.rs'
      - 'tauri-app/src-tauri/Cargo.toml'
      - 'tauri-app/src-tauri/Cargo.lock'
      - 'tauri-app/src/floating/floatingGuide*.test.mjs'
      - 'scripts/release_version.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: windows-exact-index-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-v1
      - name: Build frontend
        working-directory: tauri-app
        shell: pwsh
        run: |
          npm ci --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and test empty-source safety cases
        shell: pwsh
        run: |
          rustc --version
          cargo test --locked --manifest-path tauri-app/src-tauri/Cargo.toml --lib empty_sources::tests -- --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath empty-sources.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full-size pressure case
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tauri-app/src-tauri/Cargo.toml --lib exact_index_scans_more_than_20_000_session_files_without_truncation -- --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath pressure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full native library regression
        timeout-minutes: 12
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tauri-app/src-tauri/Cargo.toml --lib -- --test-threads=1 2>&1 | Tee-Object -FilePath native-library.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guide and version regression
        working-directory: tauri-app
        shell: pwsh
        run: |
          node --test src/floating/floatingGuideExtent.test.mjs src/floating/floatingGuideMeasurement.test.mjs ../scripts/release_version.test.mjs 2>&1 | Tee-Object -FilePath ../guide-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: windows-exact-index-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exact-index-regression
          path: '*.log'
          if-no-files-found: warn
          retention-days: 7
