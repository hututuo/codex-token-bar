name: Apply verified recovery patch

on:
  push:
    branches: ['codex/tokenbar-recovery-control-20261101']
    paths: ['recovery-patches/current.patch']

permissions:
  contents: read

jobs:
  apply:
    concurrency:
      group: tokenbar-recovery-patch-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.apply.outputs.source_sha }}
      native_changed: ${{ steps.apply.outputs.native_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/tokenbar-recovery-20261101
          path: work
          fetch-depth: 0
      - id: apply
        name: Require exact parent and resulting tree; never force-push or publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, re, subprocess
          work = pathlib.Path('work').resolve()
          patch = pathlib.Path('control/recovery-patches/current.patch').read_bytes()
          header, separator, diff = patch.partition(b'\n')
          if not separator or not header.startswith(b'# tokenbar-recovery '):
              raise SystemExit('Missing recovery patch manifest')
          spec = json.loads(header.removeprefix(b'# tokenbar-recovery '))
          for field in ('base_sha', 'tree_sha'):
              if not re.fullmatch('[0-9a-f]{40}', spec[field]):
                  raise SystemExit('Invalid exact source identity')
          if type(spec.get('native_changed')) is not bool or not isinstance(spec.get('message'), str):
              raise SystemExit('Invalid patch metadata')
          if spec.get('encoding') == 'gzip-base64-parts':
              parts = spec.get('parts')
              if not isinstance(parts, list) or not 1 <= len(parts) <= 64:
                  raise SystemExit('Invalid bounded multipart transport')
              chunks = []
              control = pathlib.Path('control').resolve()
              for part in parts:
                  if not isinstance(part, dict) or not re.fullmatch(r'recovery-patches/[A-Za-z0-9_-]+\.b64', part.get('path', '')):
                      raise SystemExit('Invalid patch part path')
                  path = control / part['path']
                  if path.is_symlink() or not path.resolve().is_relative_to(control):
                      raise SystemExit('Patch part escapes checkout')
                  if type(part.get('length')) is not int or not 0 < part['length'] <= 16384:
                      raise SystemExit('Invalid patch part length')
                  with path.open('rb') as stream:
                      chunk = stream.read(16385).strip()
                  if len(chunk) != part['length'] or hashlib.sha256(chunk).hexdigest() != part.get('sha256'):
                      raise SystemExit('Patch part transport integrity mismatch')
                  chunks.append(chunk)
              diff = b''.join(chunks)
          if spec.get('encoding') in ('gzip-base64', 'gzip-base64-parts'):
              with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(diff.strip(), validate=True))) as stream:
                  diff = stream.read(8 * 1024 * 1024 + 1)
          elif spec.get('encoding', 'plain') != 'plain':
              raise SystemExit('Unsupported patch encoding')
          if len(diff) > 8 * 1024 * 1024:
              raise SystemExit('Patch exceeds the bounded review transport')
          if spec.get('diff_sha256') and hashlib.sha256(diff).hexdigest() != spec['diff_sha256']:
              raise SystemExit('Diff transport integrity mismatch')
          def git(*args, **kwargs):
              return subprocess.check_output(['git', '-C', str(work), *args], **kwargs).decode().strip()
          if git('rev-parse', 'HEAD') != spec['base_sha']:
              raise SystemExit('Repair branch advanced; rebase and verify again, do not overwrite')
          git('apply', '--index', '--check', '--whitespace=error-all', '-', input=diff)
          git('apply', '--index', '--whitespace=error-all', '-', input=diff)
          if git('write-tree') != spec['tree_sha']:
              raise SystemExit('Patched tree differs from the locally verified tree; no commit made')
          git('-c', 'user.name=Token Bar Recovery', '-c', 'user.email=138413246+hututuo@users.noreply.github.com',
              'commit', '-m', spec['message'])
          sha = git('rev-parse', 'HEAD')
          git('push', 'origin', 'HEAD:refs/heads/codex/tokenbar-recovery-20261101')
          out = pathlib.Path('patch-evidence'); out.mkdir()
          (out/'result.json').write_text(json.dumps({**spec, 'source_sha': sha,
              'patch_sha256': hashlib.sha256(patch).hexdigest(), 'control_sha': os.environ['GITHUB_SHA']}, indent=2)+'\n')
          git('bundle', 'create', str((out/'repair-changes.bundle').resolve()), 'HEAD', '^d831ae416c78f9f1950e8b4ed9755c8718a5b51d')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'source_sha={sha}\nnative_changed={str(spec["native_changed"]).lower()}\n')
          print(json.dumps({'source_sha':sha, 'tree_sha':spec['tree_sha']}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-patch-${{ github.run_id }}
          path: patch-evidence/
          if-no-files-found: error
          retention-days: 30
  checks:
    needs: apply
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.apply.outputs.source_sha }}
  upgrade:
    needs: apply
    if: needs.apply.outputs.native_changed == 'true'
    uses: ./.github/workflows/release-upgrade-compatibility.yml
    with:
      source_sha: ${{ needs.apply.outputs.source_sha }}
  deep-checks:
    needs: apply
    if: needs.apply.outputs.native_changed == 'true'
    uses: ./.github/workflows/recovery-deep-checks.yml
    with:
      source_sha: ${{ needs.apply.outputs.source_sha }}
  production-readers:
    needs: [apply, checks]
    if: needs.apply.outputs.native_changed == 'true' && !cancelled() && needs.apply.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.93.1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.apply.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-v1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tauri-app/src-tauri/target
          key: rust-test-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-${{ needs.apply.outputs.source_sha }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-
      - name: Verify actual non-test reader routes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.1 --profile minimal
          npm ci --prefix tauri-app --registry=https://registry.npmjs.org
          npm run build --prefix tauri-app
          python3 scripts/check_business_store_fixture.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-reader-evidence-${{ matrix.os }}-${{ needs.apply.outputs.source_sha }}
          path: |
            native-production-readers.log
            native-production-readers.json
          retention-days: 30
