name: Exact index repair diagnostics

on:
  push:
    branches: [fix/v092-audit-sidebar]
    paths: [.github/workflows/index-repair-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Preserve public source and relevant Git history
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/index-repair"
          mkdir -p "$out"
          index=tauri-app/src-tauri/src/core/usage/token_count_jsonl/exact_usage_index.rs
          tests=tauri-app/src-tauri/src/core/usage/token_count_jsonl/tests.rs
          git rev-parse HEAD | tee "$out/commit.txt"
          git log --format='%H %aI %s' -G 'Full rebuilds of every size|small files|20_000|FULL|empty' -- "$index" "$tests" > "$out/history.txt"
          cat "$out/history.txt"
          git log -p -G 'Full rebuilds of every size|20_000' -- "$index" "$tests" > "$out/relevant-history.patch"
          git archive --format=tar -o "$out/source.tar" HEAD
          git bundle create "$out/history.bundle" HEAD
          sha256sum "$out/source.tar" "$out/history.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-index-repair-source
          path: ${{ runner.temp }}/index-repair/
          if-no-files-found: error
          retention-days: 3
