name: Validate official 0.9.3 to candidate 0.9.4 installer upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Wait for exact candidate build and download artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(45)
          do {
            $run = gh api repos/hututuo/codex-token-bar/actions/runs/37749712589 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate run' }
            if ($run.status -eq 'completed') { break }
            if ((Get-Date) -ge $deadline) { throw 'Candidate build did not finish before validation deadline' }
            Start-Sleep -Seconds 30
          } while ($true)
          if ($run.conclusion -ne 'success') { throw 'Candidate build failed' }
          gh run download 37749712589 --repo hututuo/codex-token-bar --name candidate-windows-7e5d0333a68abdd57d008d66bd3e1a1c0f88d6fd --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          gh release download v0.9.3 --repo hututuo/codex-token-bar --pattern '*windows-x64-setup.exe' --pattern SHA256SUMS-v0.9.3.txt --dir official
          if ($LASTEXITCODE -ne 0) { throw 'Official baseline download failed' }
      - name: Verify and install actual packages with legacy updater arguments
        shell: pwsh
        run: ./scripts/validate_094_installer_upgrade.ps1
      - name: Preserve bounded package and process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-093-to-094-installer-evidence
          path: upgrade-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
