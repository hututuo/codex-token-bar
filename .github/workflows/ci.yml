name: Hosted project checks

on:
  push:
    branches: [main, 'cloud/**', 'fix/**', 'codex/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional exact 40-character source commit; empty means this workflow commit'
        type: string
        default: ''
      claude_reader_only:
        description: 'Only compile and exercise the local Claude reader and shared parser; no full regression or packaging'
        type: boolean
        default: false
      claude_usage_only:
        description: 'Only related multi-client usage/quota suites on Swift/Rust; no full regression or packaging'
        type: boolean
        default: false
      formed_release:
        description: 'Optional real historical producer: 0.9.8, 0.9.9, 0.9.10, 0.9.11, or all'
        type: string
        default: ''
      formed_platform:
        description: 'Historical producer platform: macos, windows, or all'
        type: string
        default: all
      formed_only:
        description: 'Run only the explicitly requested historical producer matrix'
        type: boolean
        default: false
      scale:
        description: 'Add the hosted multi-size backfill performance gate'
        type: boolean
        default: false
      scale_only:
        description: 'Run only the hosted multi-size backfill performance gate'
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.formed_release || 'standard' }}-${{ inputs.formed_platform || 'all' }}-${{ inputs.scale_only && 'scale-only' || inputs.scale && 'scale' || 'standard' }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.93.1'

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          FORMED_ONLY: ${{ inputs.formed_only || false }}
          FORMED_RELEASE: ${{ inputs.formed_release || '' }}
          SCALE: ${{ inputs.scale || false }}
          SCALE_ONLY: ${{ inputs.scale_only || false }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact source SHA is required'; exit 1; }
          [[ "$FORMED_ONLY" != true || -n "$FORMED_RELEASE" ]] || { echo 'formed_only requires an explicit historical producer'; exit 1; }
          if [[ "$SCALE_ONLY" == true ]]; then
            [[ "$SCALE" == true ]] || { echo 'scale_only requires scale=true'; exit 1; }
            [[ "$FORMED_ONLY" != true && -z "$FORMED_RELEASE" ]] || { echo 'scale_only cannot be combined with formed upgrade checks'; exit 1; }
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  frontend:
    needs: source
    if: ${{ !inputs.formed_only && !inputs.scale_only && !inputs.claude_reader_only && !inputs.claude_usage_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Verify Agent Speed provenance and local patches (offline)
        run: |
          python3 scripts/agent_speed_vendor.py check
          python3 -m unittest discover -s scripts/tests -p 'test_agent_speed_vendor.py'
      - name: Verify reversible fixture quarantine with disposable databases
        run: python3 -m unittest discover -s scripts/tests -p 'test_quarantine_usage_fixture_rows.py'
      - name: Verify hosted backfill-scale workflow contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_backfill_scale_workflow.py'
      - name: Verify native scale report admission
        run: python3 -m unittest discover -s scripts/tests -p 'test_native_scale_runner.py'
      - name: Verify recovery evidence gates and negative controls
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*gate.py'
          python3 -m unittest discover -s scripts/tests -p 'test_formed_release*.py'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: tauri-app
      - run: node scripts/cloud/run-node-tests.mjs tauri-app/src --no-skips
        env:
          TOKENBAR_NODE_EXECUTION_REPORT: frontend.execution.json
      - run: node scripts/cloud/run-node-tests.mjs scripts/cloud --no-skips
        env:
          TOKENBAR_NODE_EXECUTION_REPORT: cloud-scripts.execution.json
      - run: npm run build
        working-directory: tauri-app
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: tauri-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-execution-${{ needs.source.outputs.sha }}-${{ github.run_id }}
          path: '*.execution.json'
          if-no-files-found: error
          retention-days: 7

  swift:
    needs: source
    if: ${{ !inputs.formed_only && !inputs.scale_only && !inputs.claude_reader_only }}
    runs-on: macos-26
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CODEX_CYCLE_LAYOUT_OUTPUT: ${{ github.workspace }}/visual-previews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Swift dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swift-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-v1
      - name: Prepare clean macOS host
        run: |
          swift --version
          xcodebuild -version
          command -v git-lfs >/dev/null || brew install git-lfs
          bash scripts/prepare_tiktoken_lfs.sh
      - name: Swift tests and release-script contracts
        env:
          TOKENBAR_DIAGNOSTIC_PROFILE: ${{ inputs.scale && '1' || '' }}
          CLAUDE_USAGE_ONLY: ${{ inputs.claude_usage_only || false }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TOKENBAR_NODE_EXECUTION_REPORT: release-scripts.execution.json
          TOKENBAR_DISCOVERY_RENDER_DIR: visual-previews
        run: |
          set -o pipefail
          mkdir -p visual-previews
          if [[ "$CLAUDE_USAGE_ONLY" == true ]]; then
            python3 scripts/check_test_execution.py --kind swift --log swift-tests.log --source-sha "$SOURCE_SHA" \
              --allow-untracked-output 'visual-previews/*.png' -- \
              swift test --filter 'MultiClientUsage|ClaudeDesktopQuotaHistory|ClaudeLocalQuota|MultiClientQuotaAutodiscovery|MultiClientProduct|IntegratedClientPresentation'
            exit 0
          fi
          python3 scripts/check_test_execution.py --kind swift --log swift-tests.log --source-sha "$SOURCE_SHA" \
            --allow-untracked-output 'visual-previews/*.png' \
            --require testPreciseStartupAndWarmRefreshExposePreparationAndCompleteTheStream \
            --require testEveryDiscoveryUsesTheCardWidthAndWrapsAtNarrowWidths \
            --require testCompactQuotaDotPixelsStayInsideTrackAndMatchMorphEndpoint \
            --require testDiagnosticsBundleAllowlistRemovesSecretsAndPaths \
            --require testRetainedPhysicalHandleKeepsFreshRowsAndNamespaceWithoutRepeatedOpens \
            --require testRetainedHandleRechecksSealedOwnerAndRouteOnEveryOperation \
            --require testRetainedHandlePreservesRollbackAndIndependentCommits \
            --require testRetainedHandleDoesNotKeepReadingAReplacedPhysicalFile \
            --require testRetainedHandleRejectsValidPhysicalAReplacementAndBlockedAdmission \
            --require testRetainedPhysicalConnectionSerializesConcurrentTransactions \
            --require testRetainedCatalogAvoidsRescanningUnchangedSchemaWithoutCachingRows \
            --require testRetainedCatalogSeesExternalRenameDropAndDoesNotAdmitForeignObjects \
            --require testRetainedCatalogDoesNotPublishUncommittedDDLOrRollbackNames \
            --require testModelPresentationMatchesSharedCrossPlatformCases \
            --require testDisplayGroupingConservesRawTokensAndAlreadyPricedContributions \
            --require testContentGrowthAndShrinkUpdateScrollExtentAtDefaultAndCustomScales \
            --require testHeatmapFlatteningMatchesCellGridAtNativeAndRetinaScale \
            --require testLongModelIdentitiesKeepCompactCostCardExtent \
            --require testAdjacentReadsReuseHandleWithoutCreatingAnExtraSnapshot \
            --require testSafetyOperationNeverHoldsPhysicalMutexBeforeRecoveryGate \
            --require testDiagnosticsCollectionLeavesDatabaseAndSourceTreeUnchanged \
            --require testDiagnosticsIgnoresHeldSQLiteExclusiveLock \
            --require testDiagnosticsAllowsDarwinTemporaryAliasButNotUserDirectoryLinks \
            --require testDiagnosticsJournalPreservesPreviousFailedLaunch \
            --require testDiagnosticsTimeoutProducesPartialEvidenceWithoutHanging \
            --require testInstallationConfirmationRequiresMatchingTargetBuildAndLocation \
            --require testTaskRailRenderedCapsAndSeparatorsMatchMorphForEmptyPartialFullAndStale \
            --require testTaskCapMasksSurviveImmediateReversalAndReleaseParticipants \
            --require testLegacyOptionalColumnCombinationsStayReadableAndUnchanged \
            --require testLegacyMetadataAndDashboardAllKeepExistingFields \
            --require testDestructiveRetryRejectsMissingOrChangedHistoryAndKeepsThePublishedImage \
            --require testLegacyRestoreCopiesTheSameSnapshotThatPassedItsSealProof \
            --require testBoundTemporaryObjectsCannotShadowPublishedTablesOrViews \
            --require testAbsentTemporaryDropCannotAuthorizeShadowingAMainTable \
            --require testTemporaryRenameCannotCrossMainOwnershipInEitherDirection \
            --require testRejectedBindingDoesNotReserveNamesFromUnexecutedStatements \
            --require testRepeatedWritesStillAuthorizeTheirCurrentOwnerAfterBackupClassification \
            --require testPrivateUnboundProjectionCanStillUseAnExplicitShadowTable \
            --require testUserTablesResemblingSQLiteInternalsSurviveImportAndExport \
            --require testForeignDependenciesResemblingSQLiteInternalsInvalidateProof \
            --require testBufferedRecordsFlushAtCloseAndContainOnlyStructuredDiagnostics \
            --require testRecoveryLogAllowsOnlyFixedMetadataFields \
            --require testDisabledUnavailableAndWriteFailedDiagnosticsPreserveActualMigrationAndNewAccounting -- swift test
          npm ci --prefix tauri-app --registry=https://registry.npmjs.org
          node scripts/cloud/run-node-tests.mjs scripts 2>&1 | tee release-script-tests.log
      - name: Preserve hosted crash diagnostics on failure
        if: failure()
        run: |
          mkdir -p hosted-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*xctest*' -o -name '*CodexTokenBar*' \) -exec cp {} hosted-diagnostics/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-check-logs-${{ github.run_id }}
          path: |
            *.log
            *.execution.json
            hosted-diagnostics/
          retention-days: 7
      - name: Upload production-view visual previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-visual-previews-${{ needs.source.outputs.sha }}
          path: visual-previews/*.png
          if-no-files-found: warn
          retention-days: 14

  native:
    needs: source
    if: ${{ !inputs.formed_only && !inputs.scale_only && !inputs.claude_reader_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.scale && 90 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ runner.os == 'Windows' && !inputs.claude_usage_only }}
        with:
          dotnet-version: '10.0.303'
      - name: Rust registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-v1
      - name: Native compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tauri-app/src-tauri/target
          key: rust-test-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-${{ needs.source.outputs.sha }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}-
      - name: Agent Speed reporter compile and privacy self-test
        if: ${{ runner.os == 'Windows' && !inputs.claude_usage_only }}
        shell: pwsh
        run: |
          dotnet build tools/AgentSpeedReporter/AgentSpeedReporter.csproj --configuration Release -p:LangVersion=latest -p:Nullable=enable -p:ImplicitUsings=enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/AgentSpeedReporter/AgentSpeedReporter.csproj --configuration Release -p:LangVersion=latest -p:Nullable=enable -p:ImplicitUsings=enable -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Claude local reader compile and privacy self-test
        if: ${{ runner.os == 'Windows' && !inputs.claude_usage_only }}
        shell: pwsh
        run: |
          dotnet run --project tools/ClaudeLocalReader/ClaudeLocalReader.csproj --configuration Release -p:LangVersion=latest -p:Nullable=enable -p:ImplicitUsings=enable -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Rust and frontend
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.1 --profile minimal
          rustc -vV
          if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; xcodebuild -version; fi
          cd tauri-app
          npm ci --registry=https://registry.npmjs.org
          npm run build
      - name: Check production native configuration
        if: ${{ !inputs.claude_usage_only }}
        shell: bash
        run: cargo check --locked --manifest-path tauri-app/src-tauri/Cargo.toml
      - name: Exercise production business-store routing and runtime recovery
        if: ${{ !inputs.claude_usage_only }}
        id: production_fixture
        shell: bash
        env:
          TOKENBAR_NATIVE_SCALE: ${{ inputs.scale && '1' || '' }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path tauri-app/src-tauri/Cargo.toml --features business-store-fixture --example business-store-fixture
          python scripts/cloud/run-business-store-fixture.py tauri-app/src-tauri/target/debug/examples/business-store-fixture
      - name: Preserve production fixture evidence immediately
        if: ${{ always() && !inputs.claude_usage_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-production-${{ matrix.os }}-${{ github.run_id }}
          path: runtime-recovery-production.*
          retention-days: 7
      - name: Full native regression including original pressure case
        if: ${{ !cancelled() }}
        env:
          TOKENBAR_DIAGNOSTIC_PROFILE: ${{ inputs.scale && '1' || '' }}
          CLAUDE_USAGE_ONLY: ${{ inputs.claude_usage_only || false }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLAUDE_USAGE_ONLY" == true ]]; then
            python scripts/check_test_execution.py --kind rust --log native-library.log --source-sha "$SOURCE_SHA" -- \
              cargo test --locked --manifest-path tauri-app/src-tauri/Cargo.toml --lib multi_client_ -- --test-threads=1
          else
            python scripts/check_test_execution.py --kind rust --log native-library.log --source-sha "$SOURCE_SHA" \
              --allow-untracked-output runtime-recovery-production.log \
              --allow-untracked-output runtime-recovery-production.json \
              --allow-untracked-output runtime-recovery-production.validation.json \
              --require failed_partial_backup_is_never_published \
              --require concurrent_matching_backup_is_reused_without_overwriting_or_leaking_temporary \
              --require concurrent_different_backup_is_preserved_and_never_accepted_as_expected_snapshot \
              --require backup_rejects_source_alias_before_building_and_preserves_source \
              --require backup_reads_live_committed_wal_into_a_self_contained_snapshot \
              --require namespace_clone_preserves_cyclic_foreign_keys_and_rolls_back_invalid_copy \
              --require failed_import_rolls_back_only_the_requested_namespace \
              --require failed_export_preserves_target_and_restores_connection_for_retry \
              --require proof_and_round_trip_preserve_schema_details_and_hidden_rowids \
              --require imports_are_partitioned_idempotent_and_preserve_sqlite_sequence \
              --require incident_destination_replacement_checks_current_proof_inside_write_transaction \
              --require incident_replacement_rechecks_the_attached_source_against_its_frozen_proof \
              --require legacy_options_accept_each_optional_column_combination_without_writing \
              --require malformed_or_missing_state_stays_an_error_and_is_not_created \
              --require missing_threads_table_is_an_error_but_valid_empty_legacy_tables_stay_empty \
              --require legacy_empty_manifest_never_hides_payload_rows_after_a_warm_catalog \
              --require legacy_empty_manifest_requires_the_complete_known_table_contract \
              --require legacy_catalog_rejects_foreign_named_objects_depending_on_stage_tables \
              --require known_empty_partial_stage_stays_occupied_for_the_existing_restart_validator \
              --require held_owner_lookup_rechecks_identity_and_root_versions_without_writing \
              --require held_owner_lookup_preserves_marker_pool_and_file_fences \
              --require candidate_index_upgrades_v1_once_without_changing_retained_rows \
              --require candidate_index_migration_rolls_back_ddl_catalog_and_version_on_failure \
              --require candidate_index_rejects_unknown_or_partial_contracts_without_repairing_them \
              --require candidate_index_concurrent_openers_admit_one_committed_upgrade \
              --require candidate_index_versions_preserve_real_pending_publication_bridge \
              --require candidate_index_preserves_order_isolation_late_seals_and_unknown_codec \
              --require candidate_lookup_work_is_bounded_by_matches_not_retained_job_headers \
              --require held_owner_resolution_keeps_alias_conflicts_and_reservations_live \
              --require bound_temporary_tables_and_views_cannot_shadow_published_rows \
              --require bound_drop_and_rename_preserve_main_and_temp_ownership \
              --require rejected_binding_batches_leave_no_names_or_partial_sql_execution \
              --require bound_temporary_objects_and_dependencies_remain_usable \
              --require bound_sequence_projection_tracks_first_autoincrement_and_transaction_rollback \
              --require bound_batch_can_create_and_read_its_first_autoincrement_sequence \
              --require missing_sequence_does_not_reject_literal_or_comment_markers \
              --require completed_message_receipts_do_not_rescan_event_payloads \
              --require pending_message_repairs_respect_current_receipts_and_binding_availability \
              --require fresh_summary_preserves_day_modes_and_same_generation_changes \
              --require fresh_summary_keeps_integer_overflow_as_an_error_and_releases_its_snapshot \
              --require dashboard_range_ignores_unrelated_sources_after_existing_index_upgrade \
              --require dashboard_range_preserves_pending_visibility_and_replacement_rules \
              --require dashboard_range_keeps_overflow_as_an_error_and_rolls_back \
              --require dashboard_range_executes_through_the_bound_store_namespace \
              --require current_index_reopen_adds_bucket_index_without_changing_published_events \
              --require prepared_aggregate_waiting_for_display_does_not_count_or_take_a_write_lock \
              --require held_retention_lookup_observes_new_receipts_and_rejects_changed_root_and_owner \
              --require held_retention_lookup_keeps_the_callers_snapshot_and_transaction \
              --require repeated_catalog_ddl_reuses_only_exact_owner_independent_bodies \
              --require owner_dependent_identifiers_literals_and_comments_bypass_contract_memo \
              --require contract_memo_bounds_and_nonmatching_headers_keep_original_validation \
              --require missing_and_known_empty_legacy_candidates_use_the_held_pool_without_becoming_facts \
              --require user_tables_resembling_sqlite_internals_survive_import_and_export \
              --require foreign_dependencies_resembling_sqlite_internals_invalidate_proof \
              --require disk_failure_and_full_queue_return_status_without_panicking \
              --require diagnostics_modes_never_change_managed_legacy_import_or_later_target_rows \
              --require diagnostic_allowlist_drops_secret_baits_and_paths \
              --require diagnostic_old_updater_receipt_survives_missing_installer_journal \
              --require diagnostic_progress_timestamp_retains_observation_time_after_queue_delay \
              --require diagnostic_collection_never_opens_or_changes_business_database \
              --require diagnostic_collector_ignores_exclusive_sqlite_lock \
              --require diagnostic_restart_retains_prior_failed_session \
              --require diagnostic_timeout_is_bounded_and_partial_zip_is_valid \
              --require panic_guard_notifies_an_already_waiting_cold_reader -- \
              cargo test --locked --manifest-path tauri-app/src-tauri/Cargo.toml --lib -- --test-threads=1
          fi
      - name: Prove the backup regression rejects disabled cleanup
        if: ${{ success() && !inputs.claude_usage_only }}
        shell: bash
        run: python scripts/check_backup_cleanup_gate.py
      - name: Preserve backup cleanup control evidence
        if: ${{ always() && !inputs.claude_usage_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-cleanup-control-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-backup-control/
          if-no-files-found: warn
          retention-days: 7
      - name: Windows packaging self-test
        if: ${{ runner.os == 'Windows' && !inputs.claude_usage_only }}
        shell: pwsh
        run: |
          . ./scripts/cloud/prepare-windows.ps1
          ./scripts/build_tauri_windows_release.selftest.ps1
      - name: Prove valid physical A replacement is rejected in production
        if: ${{ success() && !inputs.claude_usage_only }}
        shell: bash
        run: python scripts/check_route_identity_gate.py
      - name: Preserve route identity control evidence
        if: ${{ always() && !inputs.claude_usage_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-identity-control-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/route-identity-control/
          if-no-files-found: warn
          retention-days: 14
      - name: Require the production fixture even when other regressions pass
        if: ${{ always() && !inputs.claude_usage_only }}
        shell: bash
        env:
          FIXTURE_OUTCOME: ${{ steps.production_fixture.outcome }}
        run: test "$FIXTURE_OUTCOME" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-check-logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            *.log
            *.execution.json
            runtime-recovery-production.json
            runtime-recovery-production.validation.json
            tauri-app/src-tauri/target/debug/examples/business-store-fixture.exe
          retention-days: 7

  windows-updater:
    needs: source
    if: ${{ !inputs.formed_only && !inputs.scale_only && !inputs.claude_reader_only && !inputs.claude_usage_only }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Windows installer fault regression
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $env:PATH = "$nsis;$env:PATH"
          ./scripts/windows_update_faults.ps1
      - name: Windows Exact path spelling source probe
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust path probe toolchain setup failed' }
          python scripts/cloud/probe_exact_path_spelling.py

  claude-reader:
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.claude_reader_only }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.303'
      - name: Local Claude IPC and shared parser self-tests
        shell: pwsh
        run: |
          dotnet run --project tools/AgentSpeedReporter/AgentSpeedReporter.csproj --configuration Release -p:LangVersion=latest -p:Nullable=enable -p:ImplicitUsings=enable -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/ClaudeLocalReader/ClaudeLocalReader.csproj --configuration Release -p:LangVersion=latest -p:Nullable=enable -p:ImplicitUsings=enable -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  formed-upgrade:
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.formed_release != '' }}
    uses: ./.github/workflows/formed-release-upgrade.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      release: ${{ inputs.formed_release }}
      platform: ${{ inputs.formed_platform }}

  scale:
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scale || inputs.scale_only) }}
    uses: ./.github/workflows/backfill-scale.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  evidence:
    needs: [source, frontend, swift, native, windows-updater, formed-upgrade, scale]
    if: ${{ always() && !inputs.formed_only && !inputs.scale_only && !inputs.claude_reader_only && !inputs.claude_usage_only && needs.source.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Seal successful check identity
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          JOB_OUTCOMES: ${{ toJSON(needs) }}
          FORMED_REQUESTED: ${{ inputs.formed_release != '' && true || false }}
          SCALE_REQUESTED: ${{ inputs.scale && true || false }}
        run: |
          python3 scripts/cloud/check_ci_evidence.py --needs "$JOB_OUTCOMES" \
            --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --formed-requested "$FORMED_REQUESTED" --scale-requested "$SCALE_REQUESTED"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-execution-${{ needs.source.outputs.sha }}-${{ github.run_id }}
          path: ci-execution.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-passed-${{ needs.source.outputs.sha }}
          path: checked-source.json
          retention-days: 30
